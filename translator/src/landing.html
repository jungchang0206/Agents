<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Translator &amp; Summarizer</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 960px;
      margin: 32px auto;
      padding: 0 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #111;
    }
    .container {
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
    h1 { margin: 0 0 12px; color: #1a1a1a; }
    .endpoints { background: #f8f9fa; padding: 16px; border-radius: 12px; margin: 20px 0; }
    .tabs {
      display: flex;
      gap: 8px;
      margin: 24px 0 16px;
      border-bottom: 2px solid #e0e0e0;
    }
    .tab {
      padding: 12px 24px;
      cursor: pointer;
      background: none;
      border: none;
      font-size: 16px;
      color: #555;
      transition: all 0.2s;
    }
    .tab.active {
      color: #667eea;
      border-bottom: 3px solid #667eea;
      font-weight: 600;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    textarea {
      width: 100%;
      min-height: 140px;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      resize: vertical;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    select, button {
      padding: 10px 16px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      margin: 0 8px 12px 0;
    }
    button {
      background: #667eea;
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #5568d3; }
    .result {
      margin-top: 20px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 12px;
      display: none;
    }
    .result.show { display: block; }
    .result h3 { margin: 0 0 12px; color: #667eea; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌐 AI Translator &amp; Summarizer</h1>
    <p>Translate text, summarize content, or do both — powered by Cloudflare Workers AI.</p>

    <div class="endpoints">
      <strong>Endpoints:</strong><br>
      <a href="/.well-known/agint/manifest.json" target="_blank">GET /.well-known/agint/manifest.json</a> — Capabilities manifest<br><br>
      <a href="/v1/mcp/tools/call" target="_blank">POST /v1/mcp/tools/call</a> — Tool calls (POST required)
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('translate', event)">Translate</button>
      <button class="tab" onclick="switchTab('summarize', event)">Summarize</button>
      <button class="tab" onclick="switchTab('both', event)">Both</button>
    </div>

    <!-- Translate -->
    <div id="translate" class="tab-content active">
      <h3>Translate Text</h3>
      <textarea id="translateText" placeholder="Enter text to translate...">Hello! How are you today?</textarea>
      <div>
        <select id="targetLang">
          <option value="Spanish">Spanish</option>
          <option value="French">French</option>
          <option value="German">German</option>
          <option value="Japanese">Japanese</option>
          <option value="Chinese">Chinese</option>
          <option value="English">English</option>
          <option value="Korean">Korean</option>
          <option value="Italian">Italian</option>
        </select>
        <button onclick="translate()">Translate</button>
      </div>
      <div id="translateResult" class="result"></div>
    </div>

    <!-- Summarize -->
    <div id="summarize" class="tab-content">
      <h3>Summarize Text</h3>
      <textarea id="summarizeText" placeholder="Paste long text here...">Artificial intelligence is transforming industries from healthcare to logistics. Advanced models can now diagnose diseases, optimize supply chains, and generate creative content. However, rapid progress also raises serious concerns around bias, privacy, job displacement, and long-term societal impact.</textarea>
      <div>
        <select id="summaryLength">
          <option value="short">Short (1-2 sentences)</option>
          <option value="medium" selected>Medium (3-5 sentences)</option>
          <option value="long">Long (detailed paragraph)</option>
        </select>
        <button onclick="summarize()">Summarize</button>
      </div>
      <div id="summarizeResult" class="result"></div>
    </div>

    <!-- Both -->
    <div id="both" class="tab-content">
      <h3>Translate &amp; Summarize</h3>
      <textarea id="bothText" placeholder="Enter text...">Climate change remains one of the defining challenges of our era. Rising temperatures drive extreme weather, sea-level rise, and biodiversity loss. While renewable energy adoption accelerates, global emissions must fall dramatically this decade to limit warming to 1.5°C.</textarea>
      <div>
        <select id="bothLang">
          <option value="Spanish">Spanish</option>
          <option value="French">French</option>
          <option value="German">German</option>
          <option value="Japanese">Japanese</option>
          <option value="Chinese">Chinese</option>
        </select>
        <select id="bothLength">
          <option value="short">Short summary</option>
          <option value="medium" selected>Medium summary</option>
          <option value="long">Long summary</option>
        </select>
        <button onclick="translateAndSummarize()">Process</button>
      </div>
      <div id="bothResult" class="result"></div>
    </div>
  </div>

  <script>
    function switchTab(tab, event) {
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(tab).classList.add('active');
    }

    async function postTool(tool, args) {
      const res = await fetch('/v1/mcp/tools/call', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tool, arguments: args })
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    async function translate() {
      const text = document.getElementById('translateText').value.trim();
      const lang = document.getElementById('targetLang').value;
      const el   = document.getElementById('translateResult');
      if (!text) return;
      el.innerHTML = '<p>Translating...</p>';
      el.classList.add('show');
      try {
        const data = await postTool('translate_text', { text, target_language: lang });
        el.innerHTML = `<h3>Translation:</h3><p>${data.translated_text || '—'}</p><small>to ${data.target_language}</small>`;
      } catch (e) {
        el.innerHTML = `<p style="color:red">Error: ${e.message}</p>`;
      }
    }

    async function summarize() {
      const text = document.getElementById('summarizeText').value.trim();
      const len  = document.getElementById('summaryLength').value;
      const el   = document.getElementById('summarizeResult');
      if (!text) return;
      el.innerHTML = '<p>Summarizing...</p>';
      el.classList.add('show');
      try {
        const data = await postTool('summarize_text', { text, length: len });
        el.innerHTML = `<h3>Summary:</h3><p>${data.summary || '—'}</p><small>${data.original_length} → ${data.summary_length} chars</small>`;
      } catch (e) {
        el.innerHTML = `<p style="color:red">Error: ${e.message}</p>`;
      }
    }

    async function translateAndSummarize() {
      const text = document.getElementById('bothText').value.trim();
      const lang = document.getElementById('bothLang').value;
      const len  = document.getElementById('bothLength').value;
      const el   = document.getElementById('bothResult');
      if (!text) return;
      el.innerHTML = '<p>Processing...</p>';
      el.classList.add('show');
      try {
        const data = await postTool('translate_and_summarize', {
          text, target_language: lang, summary_length: len
        });
        el.innerHTML = `
          <h3>Translation:</h3><p>${data.translated_text || '—'}</p>
          <h3>Summary:</h3><p>${data.summary || '—'}</p>
          <small>Language: ${data.target_language}</small>
        `;
      } catch (e) {
        el.innerHTML = `<p style="color:red">Error: ${e.message}</p>`;
      }
    }
  </script>
</body>
</html>
